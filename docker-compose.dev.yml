# VoxDocs Development Docker Compose
# Use this for local development with hot-reloading

version: '3.8'

services:
  # Backend with hot-reload
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: voxdocs-backend-dev
    environment:
      - DEBUG=true
      - SECRET_KEY=dev-secret-key-not-for-production
      - MASTER_KEY=dev-master-key-32-bytes-long!!
      - DATABASE_URL=sqlite+aiosqlite:///./data/voxdocs.db
      - WHISPER_MODEL=small
      - WHISPER_DEVICE=cpu
    volumes:
      - ./backend/app:/app/app:ro
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - voxdocs-dev

  # Frontend with Vite dev server
  frontend:
    image: node:20-alpine
    container_name: voxdocs-frontend-dev
    working_dir: /app
    environment:
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    networks:
      - voxdocs-dev

networks:
  voxdocs-dev:
    driver: bridge
