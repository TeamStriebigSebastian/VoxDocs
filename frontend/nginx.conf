server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        # Use a variable so nginx doesn't resolve the upstream at startup.
        # This allows the container to start even if the backend DNS name
        # isn't available yet, and ensures nginx re-resolves dynamic
        # *.monk hostnames via the local DNS stub resolver.
        #
        # NOTE: This file is rendered from a template at container start
        # (envsubst) so ${BACKEND_URL} is substituted with the runtime value.
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
