# VoxDocs Docker Compose Configuration
# GDPR-compliant Dental Speech-to-Text Documentation System

version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: voxdocs-backend
    restart: unless-stopped
    environment:
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production-use-strong-key}
      - MASTER_KEY=${MASTER_KEY:-change-me-in-production-32-bytes!}
      - DATABASE_URL=sqlite+aiosqlite:///./data/voxdocs.db
      - WHISPER_MODEL=small
      - WHISPER_DEVICE=cpu
      - BATCH_PROCESSING_HOUR=2
      - RETENTION_DAYS=90
    volumes:
      # Persistent data storage
      - voxdocs-data:/app/data
      - voxdocs-models:/app/models
      - voxdocs-logs:/app/logs
    networks:
      - voxdocs-network
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend PWA Service
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: voxdocs-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - voxdocs-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

# Named volumes for persistent data
volumes:
  voxdocs-data:
    driver: local
  voxdocs-models:
    driver: local
  voxdocs-logs:
    driver: local

# Network configuration
networks:
  voxdocs-network:
    driver: bridge
